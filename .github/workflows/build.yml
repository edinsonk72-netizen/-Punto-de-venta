name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar web
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f node_modules/html5-qrcode/html5-qrcode.min.js ]; then
            cp node_modules/html5-qrcode/html5-qrcode.min.js www/html5-qrcode.min.js
            sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js|html5-qrcode.min.js|' www/index.html
          fi

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Agregar permiso de cámara
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar archivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: caja-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
